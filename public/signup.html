<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your AgriWise account — farmer or shopper</title>
<meta name="description" content="Sign up as a farmer to manage wallet takings, or as a shopper to buy seasonal produce nearby." />
<meta property="og:title" content="Create your AgriWise account — farmer or shopper" />
<meta property="og:description" content="Choose your side once at signup: farmer dashboard or produce marketplace." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/index.html">AgriWise</a>
    <nav class="nav">
      <a href="/index.html">Home</a>
      <a class="nav-account" href="/signup.html" data-account>Sign up</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="eyebrow">Sign up or log in</div>
      <h1 style="max-width:18ch">Selling, or shopping?</h1>
      <p class="muted" style="max-width:44ch">Pick your side once. Farmers open the dashboard, shoppers open the stalls.</p>

      <div class="grid-2" style="margin-top:28px">
        <div class="card">
          <div id="loginBox"></div>
          <form id="signupForm">
            <div class="field">
              <label>I am a…</label>
              <div class="wallet-choice" id="roleChoice">
                <button type="button" data-role="farmer">Farmer<br /><span class="small muted">Sell produce</span></button>
                <button type="button" data-role="consumer">Shopper<br /><span class="small muted">Buy nearby</span></button>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="sName">Full name</label>
                <input id="sName" placeholder="Naledi Motlhabane" />
              </div>
              <div class="field">
                <label for="sCountry">Country</label>
                <select id="sCountry"></select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="sLocation">Town or village</label>
                <select id="sLocation"></select>
              </div>
              <div class="field">
                <label for="sBank">Bank</label>
                <select id="sBank"></select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="sOrange">Orange Money</label>
                <input id="sOrange" type="tel" placeholder="76 000 000" />
              </div>
              <div class="field">
                <label for="sSmega">Smega</label>
                <input id="sSmega" type="tel" placeholder="71 000 000" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="sMyzaka">MyZaka</label>
                <input id="sMyzaka" type="tel" placeholder="74 000 000" />
              </div>
              <div class="field">
                <label for="sAccount">Bank account number</label>
                <input id="sAccount" type="text" placeholder="1042 887 331" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="sCard">Card number</label>
                <input id="sCard" type="text" placeholder="4111 1111 1111 1111" />
              </div>
              <div class="field">
                <label for="sPaypal">PayPal email</label>
                <input id="sPaypal" type="email" placeholder="you@example.com" />
              </div>
            </div>

            <div class="field">
              <label for="sPreferred">Preferred payment method</label>
              <select id="sPreferred"></select>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
            <p class="small muted" style="margin-top:12px">Prototype signup. Details stay on this device.</p>
          </form>
        </div>

        <div class="card">
          <h3>What you get</h3>
          <div id="roleBlurb"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">© <span data-year></span> AgriWise · Prototype build</div>
  </div>
</footer>

<script src="/assets/data.js"></script>
<script src="/assets/app.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(location.search);
    let role = params.get("role") === "consumer" ? "consumer" : params.get("role") === "farmer" ? "farmer" : null;

    const BLURB = {
      farmer: ["One balance across wallets and banks",
               "Sweeps between wallets and banks",
               "Seasonal planting and pricing guidance",
               "AI advisor for next season",
               "Loan-readiness pack for banks",
               "Advertise your stall"],
      consumer: ["Browse produce stalls near you",
                 "Filter by town or village",
                 "See what's in season and what it costs",
                 "Pay by wallet, bank, card or PayPal",
                 "Payment details stored once",
                 "Order history in your profile"]
    };

    function paint() {
      document.querySelectorAll("#roleChoice button").forEach(b =>
        b.classList.toggle("sel", b.dataset.role === role));
      const list = role ? BLURB[role] : BLURB.farmer.slice(0, 3).concat(BLURB.consumer.slice(0, 3));
      document.getElementById("roleBlurb").innerHTML =
        (role ? "" : `<p class="muted small">Choose a side.</p>`) +
        "<ul>" + list.map(i => `<li>${i}</li>`).join("") + "</ul>";
    }

    function fillLocations() {
      const c = document.getElementById("sCountry").value;
      document.getElementById("sLocation").innerHTML =
        BW.locationsFor(c).map(l => `<option>${l}</option>`).join("");
    }

    document.addEventListener("DOMContentLoaded", function () {
      const acc = currentAccount();
      if (acc) {
        document.getElementById("loginBox").innerHTML =
          `<p class="small muted">Already signed up on this device.</p>
           <a class="btn btn-primary btn-block" href="${acc.role === "farmer" ? "/farmer.html" : "/market.html"}">Log in as ${acc.name.split(" ")[0]}</a>
           <hr style="margin:20px 0;border:0;border-top:1px solid var(--line)" />`;
      }

      document.getElementById("sCountry").innerHTML =
        Object.keys(BW.COUNTRIES).map(c => `<option>${c}</option>`).join("");
      document.getElementById("sCountry").addEventListener("change", fillLocations);
      fillLocations();
      document.getElementById("sBank").innerHTML =
        `<option value="">No bank account</option>` + Object.values(BW.BANKS).map(b => `<option value="${b.id}">${b.name}</option>`).join("");
      document.getElementById("sPreferred").innerHTML = paymentOptions();
      document.querySelectorAll("#roleChoice button").forEach(b =>
        b.addEventListener("click", () => { role = b.dataset.role; paint(); }));
      paint();

      document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const val = id => document.getElementById(id).value.trim();
        if (!role) { toast("Choose farmer or shopper"); return; }
        if (!val("sName")) { toast("Enter your name"); return; }
        const account = {
          role,
          name: val("sName"),
          country: document.getElementById("sCountry").value,
          location: document.getElementById("sLocation").value,
          orange: val("sOrange"),
          smega: val("sSmega"),
          myzaka: val("sMyzaka"),
          bank: document.getElementById("sBank").value,
          account: val("sAccount"),
          card: val("sCard"),
          paypal: val("sPaypal"),
          preferred: document.getElementById("sPreferred").value
        };
        store.set("account", account);
        store.set("profile", account);
        toast("Welcome, " + account.name.split(" ")[0]);
        setTimeout(() => { location.href = "/index.html"; }, 600);
      });
    });
  })();
</script>

</body>
</html>
